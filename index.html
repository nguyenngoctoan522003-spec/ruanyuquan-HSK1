<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学卡 ·NGUYEN NGOC TOAN HSK1 — 15 Bài Từ Vựng</title>
<style>
  :root{
    --paper:#F3ECD9;
    --paper-deep:#E9DFC4;
    --ink:#211D17;
    --ink-soft:#5B5445;
    --seal:#AB3123;
    --seal-deep:#8A2419;
    --gold:#B4882B;
    --jade:#3C7A5C;
    --line: rgba(33,29,23,0.16);
    --radius: 4px;
    --font-vi: "Times New Roman", Times, "Liberation Serif", serif;
    --font-hanzi: "SimSun", "Songti SC", "STSong", serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(171,49,35,0.05), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-vi);
    min-height:100vh;
    padding-bottom:60px;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    opacity:0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(33,29,23,0.015) 0px, rgba(33,29,23,0.015) 1px, transparent 1px, transparent 3px);
  }
  .wrap{
    position:relative; z-index:1;
    max-width:820px;
    margin:0 auto;
    padding:32px 20px 0;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:12px;
  }
  .title-block{display:flex; align-items:center; gap:14px;}
  .seal-mark{
    width:46px;height:46px;flex:none;
    border:2.5px solid var(--seal);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--seal);
    font-family:var(--font-hanzi);
    font-weight:900;
    font-size:22px;
    transform:rotate(-3deg);
  }
  h1{
    font-family:var(--font-vi);
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:0.5px;
  }
  h1 small{
    display:block;
    font-family:var(--font-vi);
    font-weight:400;
    font-size:12px;
    letter-spacing:2px;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-top:3px;
  }
  .word-count{
    font-family:var(--font-vi);
    font-size:13px;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.5;
  }
  .word-count b{color:var(--seal); font-size:16px;}

  /* ---------- Lesson selector ---------- */
  .lesson-bar{
    margin-bottom:18px;
  }
  .lesson-bar-label{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;
  }
  .lesson-chips{
    display:flex; flex-wrap:wrap; gap:7px;
  }
  .lesson-chip{
    font-family:var(--font-vi);
    font-size:13.5px;
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:20px;
    padding:6px 14px;
    cursor:pointer;
    color:var(--ink);
    transition:background .15s ease, color .15s ease;
  }
  .lesson-chip:hover{background:var(--paper-deep);}
  .lesson-chip.active{background:var(--seal); border-color:var(--seal); color:#FAF6E9; font-weight:700;}

  /* ---------- Tab nav ---------- */
  nav.tabs{
    display:flex;
    gap:6px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    font-family:var(--font-vi);
    font-size:14px;
    letter-spacing:0.5px;
    background:none;
    border:none;
    border-bottom:3px solid transparent;
    color:var(--ink-soft);
    padding:10px 4px 12px;
    margin-right:22px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button .num{color:var(--gold); margin-right:6px; font-size:12px;}
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--seal);
    font-weight:700;
  }
  nav.tabs button:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--jade);
    outline-offset:2px;
  }

  section.panel{display:none;}
  section.panel.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ================= FLASHCARD ================= */
  .fc-stage{ perspective:1400px; margin-bottom:20px; }
  .fc-card{
    position:relative; width:100%; min-height:340px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .fc-card.flipped{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden;
    background:#FAF6E9; border:1.5px solid var(--ink); border-radius:var(--radius);
    box-shadow:5px 5px 0 var(--paper-deep), 5px 5px 0 1.5px var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px; text-align:center;
  }
  .fc-face.back{transform:rotateY(180deg);}
  .fc-stt{ position:absolute; top:14px; left:16px; font-size:12px; color:var(--ink-soft); letter-spacing:1px; }
  .fc-seal{
    position:absolute; top:12px; right:14px; width:34px;height:34px;
    border:2px solid var(--seal); border-radius:5px; color:var(--seal);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-hanzi); font-weight:900; font-size:16px;
    transform:rotate(4deg); opacity:0.85;
  }
  .fc-hanzi{ font-family:var(--font-hanzi); font-weight:700; font-size:88px; line-height:1; margin-bottom:14px; }
  .fc-pinyin-lg{ font-size:21px; color:var(--seal-deep); letter-spacing:0.5px; font-style:italic; }
  .fc-hint{ margin-top:22px; font-size:11px; color:var(--ink-soft); letter-spacing:1.5px; text-transform:uppercase; }
  .fc-back-row{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; justify-content:center; margin-bottom:6px;}
  .fc-hanviet{ font-size:13px; color:var(--jade); border:1px solid var(--jade); border-radius:20px; padding:2px 10px; }
  .fc-loai{ font-size:13px; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:2px 10px; }
  .fc-nghia{ font-size:26px; font-weight:700; margin:10px 0 14px; }
  .fc-vidu{ max-width:460px; border-top:1px dashed var(--line); padding-top:12px; font-size:15px; color:var(--ink-soft); line-height:1.6; }
  .fc-vidu .cn{font-family:var(--font-hanzi); font-size:19px; color:var(--ink);}
  .fc-vidu .py{font-size:13.5px; font-style:italic;}

  .fc-controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .fc-controls .grp{display:flex; gap:8px;}
  .btn{
    font-family:var(--font-vi); font-size:13.5px; letter-spacing:0.3px;
    background:var(--paper); border:1.5px solid var(--ink); border-radius:3px;
    padding:9px 14px; cursor:pointer; color:var(--ink);
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--seal); border-color:var(--seal); color:#FAF6E9;}
  .btn.primary:hover{background:var(--seal-deep);}
  .btn.icon{padding:9px 12px; font-size:16px; line-height:1;}
  .progress-txt{font-size:13px; color:var(--ink-soft);}

  /* ================= QUIZ ================= */
  .quiz-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:13px; color:var(--ink-soft); }
  .quiz-bar{ height:5px; background:var(--paper-deep); border-radius:3px; overflow:hidden; margin-bottom:22px; }
  .quiz-bar-fill{ height:100%; background:var(--seal); width:0%; transition:width .3s ease; }
  .quiz-question{
    background:#FAF6E9; border:1.5px solid var(--ink); border-radius:var(--radius);
    box-shadow:5px 5px 0 var(--paper-deep), 5px 5px 0 1.5px var(--ink);
    padding:30px 24px; text-align:center; margin-bottom:20px;
  }
  .quiz-label{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px;}
  .quiz-prompt-hanzi{font-family:var(--font-hanzi); font-size:64px; font-weight:700; margin:6px 0;}
  .quiz-prompt-text{font-size:26px; font-weight:700; margin:6px 0;}
  .quiz-prompt-sub{color:var(--seal-deep); font-size:16px; font-style:italic;}
  .quiz-options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.quiz-options{grid-template-columns:1fr;}}
  .quiz-opt{
    text-align:left; background:var(--paper); border:1.5px solid var(--ink); border-radius:3px;
    padding:14px 16px; cursor:pointer; font-family:var(--font-vi); font-size:16px;
    display:flex; align-items:center; gap:10px;
    transition:background .15s ease, border-color .15s ease;
  }
  .quiz-opt .letter{
    font-size:12px; color:var(--ink-soft); border:1px solid var(--line); border-radius:50%;
    width:22px;height:22px; display:flex;align-items:center;justify-content:center; flex:none;
  }
  .quiz-opt:hover:not(:disabled){background:var(--paper-deep);}
  .quiz-opt.correct{background:#DCEEE2; border-color:var(--jade); color:var(--jade);}
  .quiz-opt.correct .letter{border-color:var(--jade); color:var(--jade);}
  .quiz-opt.wrong{background:#F3DCD8; border-color:var(--seal); color:var(--seal-deep);}
  .quiz-opt.wrong .letter{border-color:var(--seal); color:var(--seal-deep);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-footer{display:flex; justify-content:space-between; align-items:center; margin-top:18px; min-height:38px;}
  .quiz-feedback{font-size:14px;}
  .quiz-feedback.correct{color:var(--jade);}
  .quiz-feedback.wrong{color:var(--seal);}
  .quiz-result{
    text-align:center; padding:40px 20px; background:#FAF6E9; border:1.5px solid var(--ink); border-radius:var(--radius);
    box-shadow:5px 5px 0 var(--paper-deep), 5px 5px 0 1.5px var(--ink);
  }
  .quiz-result .score{font-family:var(--font-hanzi); font-size:56px; font-weight:900; color:var(--seal);}
  .quiz-result p{color:var(--ink-soft); font-size:14px;}
  .quiz-settings{display:flex; justify-content:center; gap:8px; margin-bottom:16px;}

  /* ================= HANZI WRITER ================= */
  .hz-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; max-height:120px; overflow-y:auto; padding:4px;}
  .hz-chip{
    font-family:var(--font-hanzi); font-size:15px; background:var(--paper);
    border:1.5px solid var(--ink); border-radius:20px; padding:6px 16px; cursor:pointer;
  }
  .hz-chip.active{background:var(--seal); border-color:var(--seal); color:#FAF6E9;}
  .hz-stage{
    background:#FAF6E9; border:1.5px solid var(--ink); border-radius:var(--radius);
    box-shadow:5px 5px 0 var(--paper-deep), 5px 5px 0 1.5px var(--ink); padding:26px; text-align:center;
  }
  .hz-word-meta{margin-bottom:18px;}
  .hz-word-meta .py{color:var(--seal-deep); font-size:15px; font-style:italic;}
  .hz-word-meta .ng{font-size:15px; color:var(--ink-soft);}
  .hz-boxes{display:flex; justify-content:center; flex-wrap:wrap; gap:14px; margin-bottom:20px;}
  .hz-box-wrap{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .hz-box{
    background:
      linear-gradient(var(--line),var(--line)) center/1px 100%,
      linear-gradient(90deg,var(--line),var(--line)) center/100% 1px;
    background-repeat:no-repeat; background-color:#fff; border:1px solid var(--line); border-radius:4px;
  }
  .hz-box-label{font-size:11px; color:var(--ink-soft);}
  .hz-controls{display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
  .hz-empty{color:var(--ink-soft); font-size:14px; padding:60px 0;}

  footer{ text-align:center; margin-top:40px; font-size:12px; color:var(--ink-soft); letter-spacing:1px; }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="seal-mark">学</div>
      <h1 id="pageTitle">HSK1<small id="pageSubtitle">15 Bài · Từ vựng cơ bản</small></h1>
    </div>
    <div class="word-count">SỐ TỪ TRONG BÀI<br><b id="totalWords">6</b></div>
  </header>

  <div class="lesson-bar">
    <div class="lesson-bar-label">Chọn bài học</div>
    <div class="lesson-chips" id="lessonChips"></div>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-panel="panel-flashcard" role="tab" aria-selected="true"><span class="num">01</span>Flashcard</button>
    <button class="tab-btn" data-panel="panel-quiz" role="tab" aria-selected="false"><span class="num">02</span>Trắc nghiệm</button>
    <button class="tab-btn" data-panel="panel-hanzi" role="tab" aria-selected="false"><span class="num">03</span>Nét chữ</button>
  </nav>

  <!-- ============ PANEL 1: FLASHCARD ============ -->
  <section class="panel active" id="panel-flashcard">
    <div class="fc-stage">
      <div class="fc-card" id="fcCard">
        <div class="fc-face front">
          <div class="fc-stt" id="fcSttFront">01 / 06</div>
          <div class="fc-seal">卡</div>
          <div class="fc-hanzi" id="fcHanzi">你</div>
          <div class="fc-pinyin-lg" id="fcPinyinFront">nǐ</div>
          <div class="fc-hint">Chạm để xem nghĩa</div>
        </div>
        <div class="fc-face back">
          <div class="fc-stt" id="fcSttBack">01 / 06</div>
          <div class="fc-back-row">
            <span class="fc-hanviet" id="fcHanviet">nễ</span>
            <span class="fc-loai" id="fcLoai">Đại từ</span>
          </div>
          <div class="fc-nghia" id="fcNghia">bạn</div>
          <div class="fc-vidu">
            <div class="cn" id="fcViduCn">你好吗？</div>
            <div class="py" id="fcViduPy">Nǐ hǎo ma?</div>
            <div id="fcViduVi">Bạn khỏe không?</div>
          </div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <div class="grp">
        <button class="btn icon" id="fcPrev" title="Từ trước" aria-label="Từ trước">←</button>
        <button class="btn icon" id="fcNext" title="Từ tiếp" aria-label="Từ tiếp">→</button>
        <button class="btn icon" id="fcAudio" title="Phát âm" aria-label="Phát âm">🔊</button>
      </div>
      <span class="progress-txt" id="fcProgress">1 / 6</span>
      <div class="grp">
        <button class="btn" id="fcShuffle">Xáo trộn</button>
        <button class="btn primary" id="fcFlip">Lật thẻ</button>
      </div>
    </div>
  </section>

  <!-- ============ PANEL 2: QUIZ ============ -->
  <section class="panel" id="panel-quiz">
    <div id="quizArea"></div>
  </section>

  <!-- ============ PANEL 3: HANZI WRITER ============ -->
  <section class="panel" id="panel-hanzi">
    <div class="hz-chips" id="hzChips"></div>
    <div class="hz-stage" id="hzStage">
      <div class="hz-empty">Chọn một từ ở trên để xem thứ tự nét viết ↑</div>
    </div>
  </section>

  <footer>做卡片 · 练发音 · 记笔画 — Học từng chữ, nhớ từng nét · HSK1 trọn bộ 15 bài</footer>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============ LOAD DATA ============ */
  const DATA = JSON.parse(document.getElementById("vocab-data").textContent);
  const LESSON_ORDER = DATA.order;
  let currentLessonKey = LESSON_ORDER[0];

  function currentVocab(){ return DATA.lessons[currentLessonKey]; }
  function pad(n){ return String(n).padStart(2,"0"); }
  function lessonLabel(key){
    const num = key.replace(/[^0-9]/g,"");
    return "Bài " + num;
  }

  /* ============ LESSON SELECTOR ============ */
  const lessonChipsWrap = document.getElementById("lessonChips");
  LESSON_ORDER.forEach(key=>{
    const chip = document.createElement("button");
    chip.className = "lesson-chip";
    chip.textContent = lessonLabel(key);
    chip.dataset.key = key;
    chip.addEventListener("click", ()=> selectLesson(key));
    lessonChipsWrap.appendChild(chip);
  });

  function selectLesson(key){
    currentLessonKey = key;
    lessonChipsWrap.querySelectorAll(".lesson-chip").forEach(c=>{
      c.classList.toggle("active", c.dataset.key === key);
    });
    document.getElementById("pageSubtitle").textContent = lessonLabel(key) + " · " + currentVocab().length + " từ vựng";
    document.getElementById("totalWords").textContent = currentVocab().length;

    // reset all three panels for the new lesson
    fcOrder = currentVocab().map((_,i)=>i);
    fcIndex = 0;
    renderFlashcard();

    startQuiz();

    buildHanziChips();
  }

  /* ============ TAB NAV ============ */
  const tabBtns = document.querySelectorAll(".tab-btn");
  tabBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      tabBtns.forEach(b=>{ b.classList.remove("active"); b.setAttribute("aria-selected","false"); });
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      btn.setAttribute("aria-selected","true");
      document.getElementById(btn.dataset.panel).classList.add("active");
    });
  });

  /* ============ AUDIO (Web Speech API) ============ */
  function speak(text){
    if(!("speechSynthesis" in window)){
      alert("Trình duyệt của bạn không hỗ trợ phát âm thanh (Speech Synthesis).");
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.82;
    u.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
    if(zhVoice) u.voice = zhVoice;
    window.speechSynthesis.speak(u);
  }
  if("speechSynthesis" in window){ window.speechSynthesis.getVoices(); }

  function shuffleArr(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  /* ============ FLASHCARD ============ */
  let fcOrder = [];
  let fcIndex = 0;
  let fcFlipped = false;
  const fcCard = document.getElementById("fcCard");

  function renderFlashcard(){
    const vocab = currentVocab();
    if(!vocab.length) return;
    const w = vocab[fcOrder[fcIndex]];
    document.getElementById("fcSttFront").textContent = pad(fcIndex+1)+" / "+pad(vocab.length);
    document.getElementById("fcSttBack").textContent = pad(fcIndex+1)+" / "+pad(vocab.length);
    document.getElementById("fcHanzi").textContent = w.hanzi;
    document.getElementById("fcPinyinFront").textContent = w.pinyin;
    document.getElementById("fcHanviet").textContent = w.hanviet;
    document.getElementById("fcLoai").textContent = w.loai;
    document.getElementById("fcNghia").textContent = w.nghia;
    document.getElementById("fcViduCn").textContent = w.cn || "";
    document.getElementById("fcViduPy").textContent = w.py || "";
    document.getElementById("fcViduVi").textContent = w.vi || "";
    document.getElementById("fcProgress").textContent = (fcIndex+1)+" / "+vocab.length;
    fcFlipped = false;
    fcCard.classList.remove("flipped");
  }

  fcCard.addEventListener("click", ()=>{
    fcFlipped = !fcFlipped;
    fcCard.classList.toggle("flipped", fcFlipped);
  });
  document.getElementById("fcFlip").addEventListener("click", (e)=>{
    e.stopPropagation();
    fcFlipped = !fcFlipped;
    fcCard.classList.toggle("flipped", fcFlipped);
  });
  document.getElementById("fcNext").addEventListener("click", ()=>{
    fcIndex = (fcIndex+1) % currentVocab().length;
    renderFlashcard();
  });
  document.getElementById("fcPrev").addEventListener("click", ()=>{
    fcIndex = (fcIndex-1+currentVocab().length) % currentVocab().length;
    renderFlashcard();
  });
  document.getElementById("fcShuffle").addEventListener("click", ()=>{
    fcOrder = shuffleArr(fcOrder);
    fcIndex = 0;
    renderFlashcard();
  });
  document.getElementById("fcAudio").addEventListener("click", (e)=>{
    e.stopPropagation();
    speak(currentVocab()[fcOrder[fcIndex]].hanzi);
  });

  /* ============ QUIZ ============ */
  const quizArea = document.getElementById("quizArea");
  let quizOrder = [];
  let quizIndex = 0;
  let quizScore = 0;
  let quizAnswered = false;
  let quizTypes = [];

  function startQuiz(){
    const vocab = currentVocab();
    quizOrder = shuffleArr(vocab.map((_,i)=>i));
    quizTypes = quizOrder.map(()=> Math.random() < 0.5 ? "hanzi-to-nghia" : "nghia-to-hanzi");
    quizIndex = 0;
    quizScore = 0;
    quizAnswered = false;
    renderQuizQuestion();
  }

  function buildOptions(vocab, correctWord, type){
    const others = shuffleArr(vocab.filter(w => w.stt !== correctWord.stt)).slice(0,3);
    const pool = shuffleArr([correctWord, ...others]);
    return pool.map(w => ({
      key: w.stt,
      label: type === "hanzi-to-nghia" ? w.nghia : w.hanzi,
      isCorrect: w.stt === correctWord.stt
    }));
  }

  function renderQuizQuestion(){
    const vocab = currentVocab();
    if(!vocab.length) return;
    if(quizIndex >= quizOrder.length){
      renderQuizResult();
      return;
    }
    const w = vocab[quizOrder[quizIndex]];
    const type = quizTypes[quizIndex];
    quizAnswered = false;
    const options = buildOptions(vocab, w, type);
    const letters = ["A","B","C","D"];

    quizArea.innerHTML = `
      <div class="quiz-top">
        <span>${lessonLabel(currentLessonKey)} · CÂU ${quizIndex+1} / ${quizOrder.length}</span>
        <span>ĐIỂM: ${quizScore}</span>
      </div>
      <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${(quizIndex/quizOrder.length)*100}%"></div></div>
      <div class="quiz-question">
        <div class="quiz-label">${type === "hanzi-to-nghia" ? "Từ này có nghĩa là gì?" : "Từ nào có nghĩa sau đây?"}</div>
        ${ type === "hanzi-to-nghia"
            ? `<div class="quiz-prompt-hanzi">${w.hanzi}</div><div class="quiz-prompt-sub">${w.pinyin}</div>`
            : `<div class="quiz-prompt-text">${w.nghia}</div>` }
      </div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-footer">
        <span class="quiz-feedback" id="quizFeedback"></span>
        <button class="btn primary" id="quizNextBtn" style="display:none;">Câu tiếp →</button>
      </div>
    `;

    const optWrap = document.getElementById("quizOptions");
    options.forEach((opt,i)=>{
      const b = document.createElement("button");
      b.className = "quiz-opt";
      b.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt.label}</span>`;
      b.addEventListener("click", ()=> handleAnswer(b, opt, options, optWrap));
      optWrap.appendChild(b);
    });

    document.getElementById("quizNextBtn").addEventListener("click", ()=>{
      quizIndex++;
      renderQuizQuestion();
    });
  }

  function handleAnswer(btn, opt, options, optWrap){
    if(quizAnswered) return;
    quizAnswered = true;
    const feedback = document.getElementById("quizFeedback");
    const buttons = optWrap.querySelectorAll(".quiz-opt");
    buttons.forEach((b,i)=>{
      b.disabled = true;
      if(options[i].isCorrect) b.classList.add("correct");
    });
    if(opt.isCorrect){
      quizScore++;
      btn.classList.add("correct");
      feedback.textContent = "✓ Chính xác!";
      feedback.className = "quiz-feedback correct";
    } else {
      btn.classList.add("wrong");
      feedback.textContent = "✗ Chưa đúng, xem đáp án đúng bên trên.";
      feedback.className = "quiz-feedback wrong";
    }
    document.getElementById("quizNextBtn").style.display = "inline-block";
  }

  function renderQuizResult(){
    const pct = Math.round((quizScore/quizOrder.length)*100);
    let comment = "Cố lên nhé, luyện lại một lần nữa!";
    if(pct === 100) comment = "Xuất sắc! Bạn thuộc lòng cả bài rồi 👏";
    else if(pct >= 70) comment = "Khá tốt! Chỉ còn vài từ cần ôn lại.";
    quizArea.innerHTML = `
      <div class="quiz-result">
        <div class="quiz-label">KẾT QUẢ · ${lessonLabel(currentLessonKey)}</div>
        <div class="score">${quizScore}/${quizOrder.length}</div>
        <p>${pct}% chính xác — ${comment}</p>
        <button class="btn primary" id="quizRestartBtn">Làm lại</button>
      </div>
    `;
    document.getElementById("quizRestartBtn").addEventListener("click", startQuiz);
  }

  /* ============ HANZI WRITER (Nét chữ) ============ */
  const hzChipsWrap = document.getElementById("hzChips");
  const hzStage = document.getElementById("hzStage");
  let activeWriters = [];

  function buildHanziChips(){
    hzChipsWrap.innerHTML = "";
    const vocab = currentVocab();
    vocab.forEach((w, idx)=>{
      const chip = document.createElement("button");
      chip.className = "hz-chip";
      chip.textContent = w.hanzi;
      chip.addEventListener("click", ()=>{
        hzChipsWrap.querySelectorAll(".hz-chip").forEach(c=>c.classList.remove("active"));
        chip.classList.add("active");
        loadHanziWord(w);
      });
      hzChipsWrap.appendChild(chip);
    });
    if(vocab.length){
      hzChipsWrap.firstChild.classList.add("active");
      loadHanziWord(vocab[0]);
    } else {
      hzStage.innerHTML = `<div class="hz-empty">Không có từ nào trong bài này.</div>`;
    }
  }

  function loadHanziWord(w){
    activeWriters = [];
    const chars = Array.from(w.writeChars || w.hanzi);
    const boxSize = chars.length > 2 ? 100 : (chars.length > 4 ? 80 : 160);

    hzStage.innerHTML = `
      <div class="hz-word-meta">
        <span class="py">${w.pinyin}</span> · <span class="ng">${w.nghia}</span>
      </div>
      <div class="hz-boxes" id="hzBoxes"></div>
      <div class="hz-controls">
        <button class="btn" id="hzReplay">↺ Xem lại nét</button>
        <button class="btn" id="hzQuizMode">✎ Luyện viết</button>
        <button class="btn icon" id="hzAudioBtn">🔊</button>
      </div>
    `;

    const boxesWrap = document.getElementById("hzBoxes");
    chars.forEach((ch, i)=>{
      const boxId = "hz-box-"+i;
      const col = document.createElement("div");
      col.className = "hz-box-wrap";
      col.innerHTML = `<div class="hz-box" id="${boxId}" style="width:${boxSize}px;height:${boxSize}px;"></div><span class="hz-box-label">Chữ ${i+1}</span>`;
      boxesWrap.appendChild(col);

      try{
        const writer = HanziWriter.create(boxId, ch, {
          width: boxSize,
          height: boxSize,
          padding: 10,
          showOutline: true,
          strokeAnimationSpeed: 1,
          delayBetweenStrokes: 220,
          strokeColor: "#211D17",
          outlineColor: "#D9CFAE",
          drawingColor: "#AB3123"
        });
        activeWriters.push(writer);
      }catch(err){
        document.getElementById(boxId).innerHTML = "⚠";
      }
    });

    function playAll(){
      activeWriters.forEach((writer, i)=>{
        setTimeout(()=> writer.animateCharacter(), i*900);
      });
    }
    playAll();

    document.getElementById("hzReplay").addEventListener("click", playAll);
    document.getElementById("hzAudioBtn").addEventListener("click", ()=> speak(w.hanzi));
    document.getElementById("hzQuizMode").addEventListener("click", ()=>{
      activeWriters.forEach(writer=>{
        writer.quiz({ onComplete: function(){} });
      });
    });
  }

  /* ============ INIT ============ */
  selectLesson(LESSON_ORDER[0]);

})();

</script>
</body>
</html>
